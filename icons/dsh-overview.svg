<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="ov-frame" x1="8" y1="7" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8DEF"/>
      <stop offset="1" stop-color="#3F5BD9"/>
    </linearGradient>
    <linearGradient id="ov-fill" x1="9" y1="8" x2="27" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5B8DEF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3F5BD9" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- card frame -->
  <rect x="8" y="7" width="20" height="22" rx="3.8" fill="url(#ov-fill)" stroke="url(#ov-frame)" stroke-width="2"/>
  <!-- header row -->
  <rect x="11.5" y="10.8" width="7" height="1.8" rx="0.9" fill="#4D6BFE" opacity="0.95"/>
  <!-- three compact list rows -->
  <rect x="11.5" y="15.4" width="3" height="3" rx="0.7" fill="#4D6BFE" opacity="0.7"/>
  <rect x="15.8" y="16.2" width="8.7" height="1.5" rx="0.75" fill="#4D6BFE" opacity="0.45"/>
  <rect x="11.5" y="20" width="3" height="3" rx="0.7" fill="#4D6BFE" opacity="0.7"/>
  <rect x="15.8" y="20.8" width="10.4" height="1.5" rx="0.75" fill="#4D6BFE" opacity="0.45"/>
</svg>
