<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="dsh-pr-inbox">
  <!-- 收件盘：主体在 8..28 之内，纯填充、无描边依赖，颜色自带（官方插件图标风格）。 -->
  <defs>
    <linearGradient id="tray" x1="8" y1="19" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D6BFE"/>
      <stop offset="1" stop-color="#1FA9C9"/>
    </linearGradient>
    <linearGradient id="pr" x1="11" y1="8" x2="25" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FA8FF"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
  </defs>

  <!-- 盘体 -->
  <path d="M8 19.5h5.2c.9 0 1.4 1 1 1.8-.6 1.1.2 2.4 1.5 2.4h4.6c1.3 0 2.1-1.3 1.5-2.4-.4-.8.1-1.8 1-1.8H28v5.2a3.3 3.3 0 0 1-3.3 3.3H11.3A3.3 3.3 0 0 1 8 24.7v-5.2Z" fill="url(#tray)"/>

  <!-- PR 形状：两点 + 一条竖线 + 一条汇入盘的弧 -->
  <circle cx="12.2" cy="9.6" r="2.4" fill="url(#pr)"/>
  <circle cx="12.2" cy="17.6" r="2.4" fill="url(#pr)"/>
  <circle cx="23.4" cy="12.6" r="2.4" fill="url(#pr)"/>
  <path d="M12.2 12v3.2" stroke="#4D6BFE" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M23.4 15v1.4a3.4 3.4 0 0 1-3.4 3.4h-4.6" stroke="#4D6BFE" stroke-width="1.7" stroke-linecap="round" fill="none"/>
</svg>